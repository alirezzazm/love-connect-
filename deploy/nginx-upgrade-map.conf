# کپی به /etc/nginx/conf.d/love-connect-upgrade-map.conf
#
# مقدار درست هدر Connection برای وب‌سوکت. اگر به‌جای این، سرراست
# `Connection "upgrade"` بگذاری، روی هر درخواست عادی هم upgrade فرستاده
# می‌شود؛ این map فقط وقتی درخواست واقعاً upgrade باشد آن را می‌فرستد.
#
# اگر روی این سرور از قبل چنین map ای تعریف شده (مثلاً برای فروشگاه)،
# این فایل را اضافه نکن — nginx از تعریف تکراری خطا می‌گیرد.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
