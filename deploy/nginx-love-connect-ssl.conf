# nginx — بلوک HTTPS اپ دعوت به قرار روی dl193.ir
#
# این فایل جداست و نه کنار بلوک ۸۰، چون nginx اگر گواهی روی دیسک نباشد
# اصلاً بالا نمی‌آید. با جدا بودنش، استقرار می‌تواند اول HTTP را بالا
# بیاورد و این یکی را فقط وقتی نصب کند که گواهی واقعاً سر جایش باشد.
#
#   sudo cp deploy/nginx-love-connect-ssl.conf /etc/nginx/sites-available/love-connect-ssl
#   sudo ln -s /etc/nginx/sites-available/love-connect-ssl /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ─── گواهی Origin کلادفلر ────────────────────────────────────────────────
#
# در پنل کلادفلر: SSL/TLS → Origin Server → Create Certificate.
# دو متن به تو می‌دهد. روی سرور:
#
#   sudo mkdir -p /etc/ssl/cloudflare
#   sudo nano /etc/ssl/cloudflare/dl193.ir.pem   # ← Origin Certificate
#   sudo nano /etc/ssl/cloudflare/dl193.ir.key   # ← Private Key
#   sudo chmod 600 /etc/ssl/cloudflare/dl193.ir.key
#   sudo chown root:root /etc/ssl/cloudflare/*
#
# کلید خصوصی فقط همان یک بار در پنل نشان داده می‌شود؛ اگر ببندی‌اش باید
# گواهی تازه بسازی.
#
# بعد در همان صفحه SSL/TLS → Overview → حالت را روی **Full (strict)**
# بگذار. گواهی Origin برای همین ساخته شده و strict قبولش می‌کند.

server {
    listen 443 ssl;
    http2 on;
    # اگر سرور IPv6 دارد این خط را باز کن. روی سروری که IPv6 ندارد
    # nginx با «Address family not supported by protocol» بالا نمی‌آید.
    # listen [::]:443 ssl;

    server_name dl193.ir www.dl193.ir;

    ssl_certificate     /etc/ssl/cloudflare/dl193.ir.pem;
    ssl_certificate_key /etc/ssl/cloudflare/dl193.ir.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:love_connect_ssl:10m;
    ssl_session_timeout 1h;

    # هدرها در سطح server تعریف می‌شوند تا همهٔ location ها به ارث ببرند.
    #
    # $http_host است نه $host: $host پورت را دور می‌اندازد، و آن‌وقت Next
    # ریدایرکت‌ها را با پورت داخلی خودش می‌سازد و پورت سرور به بیرون درز می‌کند.
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    proxy_read_timeout 60s;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3001;
    }
}
