# nginx — کپی به /etc/nginx/sites-available/love-connect
# سپس:
#   sudo ln -s /etc/nginx/sites-available/love-connect /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# این فایل روی زیردامنه می‌نشیند تا به فروشگاه روی dl193.ir دست نخورد.

server {
    listen 80;
    # اگر سرور IPv6 دارد این خط را باز کن. روی سروری که IPv6 ندارد
    # nginx با «Address family not supported by protocol» بالا نمی‌آید.
    # listen [::]:80;

    server_name date.dl193.ir;

    # هدرها در سطح server تعریف می‌شوند تا همهٔ location ها به ارث ببرند.
    # اگر داخل یک location تعریف شوند، بقیهٔ location ها هیچ هدری نمی‌گیرند و
    # Host اشتباه به اپ می‌رسد.
    proxy_http_version 1.1;
    # $http_host است نه $host: $host پورت را دور می‌اندازد، و آن‌وقت Next
    # ریدایرکت‌ها را با پورت داخلی خودش می‌سازد و پورت سرور به بیرون درز می‌کند.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    proxy_read_timeout 60s;

    # سقف حجم درخواست؛ اپ فقط JSON کوچک می‌گیرد
    client_max_body_size 1m;

    # یک location کافی است. برای /_next/static خود Next هدر
    # «public, max-age=31536000, immutable» را می‌فرستد؛ تکرارش در nginx فقط
    # باعث می‌شود Cache-Control دوبار در پاسخ بیاید.
    location / {
        proxy_pass http://127.0.0.1:3001;
    }
}

