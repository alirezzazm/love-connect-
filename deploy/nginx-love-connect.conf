# nginx — کپی به /etc/nginx/sites-available/love-connect
# سپس:
#   sudo ln -s /etc/nginx/sites-available/love-connect /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# این فایل روی زیردامنه می‌نشیند تا به فروشگاه روی dl193.ir دست نخورد.

server {
    listen 80;
    listen [::]:80;
    server_name date.dl193.ir;

    # اگر گواهی مستقیم روی سرور داری (نه فقط Cloudflare)، این را نگه دار
    # و بلوک ۴۴۳ پایین را فعال کن. اگر SSL را Cloudflare می‌بندد، همین کافی است.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 60s;
    }

    # فایل‌های استاتیک Next با هش نام‌گذاری می‌شوند، پس طولانی کش می‌شوند
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

