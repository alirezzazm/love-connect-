# nginx — اپ دعوت به قرار روی دامنهٔ اصلی dl193.ir
#
#   sudo cp deploy/nginx-love-connect.conf /etc/nginx/sites-available/love-connect
#   sudo ln -s /etc/nginx/sites-available/love-connect /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ این دامنه الان دست فروشگاه است. پیش از فعال کردن این فایل باید سایت
# فروشگاه را از sites-enabled غیرفعال کنی، وگرنه دو server block سرِ یک
# server_name دعوا می‌کنند و nginx هشدار می‌دهد و اولی را برمی‌دارد:
#
#   sudo rm /etc/nginx/sites-enabled/<اسم-سایت-فروشگاه>
#
# فقط symlink را بردار، خود فایل در sites-available بماند تا هر وقت خواستی
# برگردانی‌اش. سرویس فروشگاه هم روی پورت ۳۰۰۰ دست‌نخورده می‌ماند؛ فقط دیگر
# روی این دامنه سرو نمی‌شود.

server {
    listen 80;
    # اگر سرور IPv6 دارد این خط را باز کن. روی سروری که IPv6 ندارد
    # nginx با «Address family not supported by protocol» بالا نمی‌آید.
    # listen [::]:80;

    server_name dl193.ir www.dl193.ir;

    # هدرها در سطح server تعریف می‌شوند تا همهٔ location ها به ارث ببرند.
    #
    # $http_host است نه $host: $host پورت را دور می‌اندازد، و آن‌وقت Next
    # ریدایرکت‌ها را با پورت داخلی خودش می‌سازد و پورت سرور به بیرون درز می‌کند.
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    proxy_read_timeout 60s;
    client_max_body_size 1m;

    # مسیر تأیید Let's Encrypt، اگر خواستی گواهی مستقیم بگیری
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # یک location کافی است. برای /_next/static خود Next هدر
    # «public, max-age=31536000, immutable» را می‌فرستد؛ تکرارش در nginx فقط
    # باعث می‌شود Cache-Control دوبار در پاسخ بیاید.
    location / {
        proxy_pass http://127.0.0.1:3001;
    }
}

# ---------------------------------------------------------------------------
# بلوک HTTPS اینجا نیست — در deploy/nginx-love-connect-ssl.conf است.
#
# دلیل جدا بودنش: nginx اگر ssl_certificate به فایلی اشاره کند که روی دیسک
# نیست، حتی `nginx -t` هم رد می‌شود و کل وب‌سرور بالا نمی‌آید. با جدا بودن،
# استقرار اول این بلوک ۸۰ را می‌آورد و آن یکی را فقط وقتی نصب می‌کند که
# گواهی واقعاً سر جایش باشد.
#
# dl193.ir پشت کلادفلر است، پس دو حالت داری:
#
#  الف) SSL کلادفلر روی Flexible — کلادفلر با HTTP به سرور وصل می‌شود و همین
#       بلوک ۸۰ کافی است. سریع‌ترین راه، ولی ترافیک کلادفلر تا سرور
#       رمزنگاری نشده می‌ماند.
#
#  ب) SSL کلادفلر روی Full (strict) — سرور هم باید گواهی داشته باشد.
#     گواهی Origin کلادفلر را بگذار و فایل ssl را فعال کن؛ راهنمای کامل در
#     بالای همان فایل و در DEPLOY.md بخش ۶.
# ---------------------------------------------------------------------------
